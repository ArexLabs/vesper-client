[package]
name = "vesper-client"
version = "0.1.0"
edition = "2021"
description = "Vesper Client - A modern multi-version Minecraft launcher"

[dependencies]
vesper-core = { path = "../vesper-core" }
slint = "1.17"
tokio = { version = "1", features = ["full"] }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
arboard = "3"
open = "5"

[build-dependencies]
slint-build = "1.17"

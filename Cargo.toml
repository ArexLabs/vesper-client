[workspace]
resolver = "2"
members = [
    "crates/vesper-core",
    "crates/vesper-proto",
    "crates/vesper-download",
    "crates/vesper-auth",
    "crates/vesper-git",
    "crates/vesper-update",
    "crates/vesper-daemon",
    "crates/vesper-ui",
    "crates/vesper-supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vesper Team"]
license = "MIT"

[workspace.dependencies]
vesper-core = { path = "crates/vesper-core" }
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
sled = "0.34"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tower = "0.5"
tonic = "0.12"
prost = "0.13"
async-trait = "0.1"
url = "2.5"
sha2 = "0.10"
hex = "0.4"
async-stream = "0.3"
once_cell = "1.20"
dirs = "5.0"
eframe = "0.31"
egui = "0.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"